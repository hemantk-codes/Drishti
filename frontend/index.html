<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<!-- viewport-fit=cover + user-scalable=no: this is a full-screen camera app,
     not a page you scroll or pinch-zoom. -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>Drishti — Scene Guide</title>
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">

<style>
  :root {
    --bg: #000000;
    --fg: #ffffff;
    --muted: #9a9a9a;
    --accent: #ffb020;
    --ok: #2ecc71;
    --bad: #ff4d4d;
    --panel: rgba(0, 0, 0, 0.72);
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: var(--bg);
    overflow: hidden;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color: var(--fg);
  }

  #camera {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    background: #000;
  }

  #startScreen {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 18px;
    background: var(--bg);
    z-index: 20;
    text-align: center;
    padding: 24px;
  }

  #startScreen h1 {
    margin: 0;
    font-size: 2.4rem;
    letter-spacing: 0.02em;
  }

  #startScreen p {
    margin: 0;
    max-width: 320px;
    color: var(--muted);
    font-size: 1rem;
    line-height: 1.5;
  }

  #startBtn {
    font-size: 1.2rem;
    font-weight: 600;
    padding: 16px 40px;
    border-radius: 999px;
    border: none;
    background: var(--accent);
    color: #000;
    cursor: pointer;
  }

  #startBtn:active { transform: scale(0.97); }

  #startError {
    color: var(--bad);
    font-size: 0.95rem;
    max-width: 320px;
  }

  #overlay {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 10;
    background: linear-gradient(to top, var(--panel) 60%, transparent);
    padding: 14px 16px calc(18px + env(safe-area-inset-bottom, 0));
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  #statusRow {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 0.85rem;
    color: var(--muted);
  }

  #statusDot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--bad);
    flex-shrink: 0;
  }
  #statusDot.connected { background: var(--ok); }
  #statusDot.mock { background: var(--accent); }

  #latencyText { margin-left: auto; font-variant-numeric: tabular-nums; }

  #mockBtn {
    background: transparent;
    border: 1px solid var(--muted);
    color: var(--muted);
    font-size: 0.75rem;
    padding: 4px 10px;
    border-radius: 999px;
    cursor: pointer;
  }
  #mockBtn.active {
    border-color: var(--accent);
    color: var(--accent);
  }

  #lastSpeech {
    font-size: 1.3rem;
    font-weight: 600;
    line-height: 1.35;
    min-height: 1.35em;
  }

  /* NEW: bounding-box canvas sits between the video (z-index: default/0)
     and the text overlay (z-index: 10) -- above the picture, below the
     status text, and never intercepts taps. */
  #bboxCanvas {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 5;
    pointer-events: none;
  }

  [hidden] { display: none !important; }
</style>
</head>
<body>

  <video id="camera" autoplay playsinline muted></video>

  <!-- NEW: on-screen bounding-box overlay, sized to the viewport and
       redrawn every time a server response with detections arrives. -->
  <canvas id="bboxCanvas"></canvas>

  <!-- Offscreen canvas used only to grab + downscale frames; never shown. -->
  <canvas id="captureCanvas" hidden></canvas>

  <div id="startScreen">
    <h1>Drishti</h1>
    <p>Tap start to turn on the camera and spoken guidance.</p>
    <button id="startBtn">Start</button>
    <p id="startError" hidden></p>
  </div>

  <div id="overlay" hidden>
    <div id="statusRow">
      <span id="statusDot"></span>
      <span id="statusText">Connecting…</span>
      <span id="latencyText"></span>
      <button id="mockBtn" title="Simulate backend responses without a real connection">Mock: OFF</button>
    </div>
    <div id="lastSpeech">Listening…</div>
  </div>

  <script src="app.js"></script>
</body>
</html>
